# Render Blueprint for the Django web service and managed Postgres.
# Add the PhonePe merchant values and remote ID image storage in Render's dashboard.
services:
  - type: web
    name: outdoor-movie-night
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt && npm install && npm run css && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: outdoor-movie-night-db
          property: connectionString
      - key: PHONEPE_MOCK
        value: "False"
      - key: PHONEPE_SALT_INDEX
        value: "1"
      - key: PHONEPE_BASE_URL
        value: https://api.phonepe.com/apis/hermes
      - key: PHONEPE_MERCHANT_ID
        sync: false
      - key: PHONEPE_SALT_KEY
        sync: false
      - key: PHONEPE_REDIRECT_URL
        sync: false
      - key: PHONEPE_CALLBACK_URL
        sync: false
      - key: CLOUDINARY_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false

databases:
  - name: outdoor-movie-night-db
    plan: 0.1c-256mb
    databaseName: movienight
    user: movienight

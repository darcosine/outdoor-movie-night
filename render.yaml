# Render Blueprint for the Django web service and managed Postgres.
# Configure remote poster storage in Render's dashboard.
services:
  - type: web
    name: outdoor-movie-night
    runtime: python
    plan: 0.5c-512mb
    buildCommand: pip install -r requirements.txt && npm install && npm run css && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput && python manage.py createcachetable django_cache_table
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.16"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: outdoor-movie-night-db
          property: connectionString
      - key: CLOUDINARY_URL
        sync: false
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false

databases:
  - name: outdoor-movie-night-db
    plan: 0.1c-256mb
    databaseName: movienight
    user: movienight
